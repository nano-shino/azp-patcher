name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --no-project --with pyinstaller --with UnityPy==1.25.4 --with pycryptodome==4.6.0 --with lz4==4.4.5 --with numpy==2.0.2 pyinstaller --onefile --name azp-patcher --collect-data UnityPy azp_patch.py
      - run: (Get-FileHash dist/azp-patcher.exe).Hash.ToLower() + "  azp-patcher.exe" | Out-File -Encoding ascii dist/azp-patcher.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: azp-patcher
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
